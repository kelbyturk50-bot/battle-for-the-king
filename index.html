<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9d0d4">
<title>Save King Liam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: one 16:9 sketchbook-page stage centered on a desk; menus are sketchbook sheets over the desk. Single deliberate look in both themes. */
:root{
  --desk:#c9d0d4; --ink:#2c3337; --sheet:#fdfdfb; --muted:#5d676c;
  --orange:#f0883a; --red:#e5442c; --yellow:#efd63a; --blue:#1e46b8;
  --ctrl:rgba(44,51,55,.55);
  --display:'Bangers',Impact,'Arial Black',sans-serif;
  --hand:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--desk);color:var(--ink);font-family:var(--hand);
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--orange);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
#wrap{position:relative}
#stage{position:relative;border-radius:6px;overflow:hidden;background:var(--sheet);box-shadow:0 8px 28px rgba(0,0,0,.28)}
#game{display:block;width:100%;height:100%;touch-action:none}
#pauseBtn{position:absolute;top:8px;right:8px;width:40px;height:34px;border-radius:8px;
  border:2px solid var(--ink);background:rgba(253,253,251,.9);color:var(--ink);font-size:15px;font-weight:bold;display:none}
body.playing #pauseBtn{display:block}
#controls{display:none;position:absolute;left:0;right:0;bottom:0;justify-content:space-between;align-items:flex-end;
  padding:10px 14px;pointer-events:none}
body.touch.playing #controls{display:flex}
body.touch:not(.portrait) #controls{position:fixed;z-index:5;padding:0 max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
body.touch:not(.portrait) .cbtn{width:56px;height:56px;font-size:23px;background:rgba(44,51,55,.42)}
body.touch:not(.portrait) .cbtn.big{width:66px;height:66px;font-size:27px}
body.portrait.playing #app{justify-content:flex-start;padding-top:max(10px,env(safe-area-inset-top,0px))}
body.portrait.playing #wrap{flex:1;display:flex;flex-direction:column;align-items:center;min-height:0}
body.portrait #controls{position:static;width:100%;margin-top:auto;padding:16px 4px max(16px,env(safe-area-inset-bottom,0px))}
body.portrait .cbtn{width:66px;height:66px;font-size:27px}
body.portrait .cbtn.big{width:76px;height:76px;font-size:30px}
body.portrait .pad.act{display:grid;grid-template-columns:auto auto;grid-template-areas:". s" "j a";gap:26px 12px;align-items:end;justify-items:center}
body.portrait .pad.act [data-k=j]{grid-area:j}body.portrait .pad.act [data-k=a]{grid-area:a}body.portrait .pad.act [data-k=s]{grid-area:s}
#teambar{display:none;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px 0 0}
body.portrait.playing #teambar{display:flex}
.tbtn{position:relative;width:46px;height:54px;padding:0;border:2.5px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;touch-action:manipulation}
.tbtn canvas{width:46px;height:46px;display:block}
.tbtn i{position:absolute;left:0;bottom:0;height:6px;background:#5bbf4a}
.tbtn.lead{background:var(--yellow);border-width:3.5px}
.tbtn.ko{opacity:.45}
.tbtn.need{box-shadow:0 0 0 3px var(--red);animation:needp .7s ease-in-out infinite alternate}
@keyframes needp{to{box-shadow:0 0 0 5px rgba(229,68,44,.4)}}
.pad{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
body.portrait .pad{gap:8px}
.cbtn{position:relative;width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.85);
  background:var(--ctrl);color:#fff;font-size:25px;display:grid;place-items:center;touch-action:none;padding:0}
body.portrait .cbtn{border-color:var(--ink)}
.cbtn.on{transform:scale(.9);background:rgba(229,68,44,.85)}
.cbtn small{position:absolute;bottom:-18px;font-size:13px;color:var(--ink);white-space:nowrap}
body:not(.portrait) .cbtn small{display:none}
.cbtn.big{width:72px;height:72px;font-size:29px}
.ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(var(--yellow) var(--p,100%),transparent 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px));
          mask:radial-gradient(farthest-side,transparent calc(100% - 6px),#000 calc(100% - 5px))}
.cbtn.ready{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(239,214,58,.55)}}
#hint{margin-top:10px;font-size:17px;color:var(--muted);text-align:center}
body.touch #hint{display:none}

#overlay{position:fixed;inset:0;overflow:auto;background:var(--desk);z-index:10;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px)}
#overlay.hidden{display:none}
#overlay.dim{background:rgba(32,39,43,.6)}
.sheet{position:relative;max-width:960px;margin:0 auto;background:var(--sheet);color:var(--ink);border-radius:6px;
  padding:36px 20px 24px;box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center}
.sheet::before{content:"";position:absolute;top:10px;left:24px;right:24px;height:14px;
  background:radial-gradient(circle at 7px 7px,var(--ink) 5px,transparent 6px) 0 0/30px 14px repeat-x}
.sheet.small{max-width:460px;margin-top:8vh}
h1{font-family:var(--display);font-weight:400;font-size:clamp(50px,10vw,100px);line-height:.9;margin:8px 0 6px;
  color:var(--yellow);letter-spacing:2px;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:clamp(32px,6vw,46px);margin:4px 0 6px;letter-spacing:1px;text-wrap:balance}
.lede{font-size:20px;margin:6px auto 14px;color:#4b555a;max-width:36em;line-height:1.25}
.art{width:100%;display:block;border-radius:4px;margin:6px 0 16px}
.go{font-family:var(--display);font-size:32px;letter-spacing:1px;padding:10px 36px 8px;border-radius:14px;
  background:var(--red);color:#fff;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.go.alt{background:#fff;color:var(--ink)}
.row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.link{display:block;margin:12px auto 0;background:none;border:none;font-size:19px;color:#4b555a;text-decoration:underline}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:12px}
.cards.lv{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{display:flex;flex-direction:column;background:#fff;border:3px solid var(--ink);border-radius:12px 18px 14px 20px;
  padding:8px 8px 10px;text-align:center;color:var(--ink);min-width:0}
.card:nth-child(even){border-radius:18px 12px 20px 14px}
.card:hover:not(:disabled){background:#fff8ec}
.card:disabled{opacity:.45;cursor:default}
.card canvas{width:100%;display:block;border-radius:8px}
.nm{font-family:var(--display);font-size:25px;letter-spacing:1px;margin-top:4px}
.desc{font-size:16px;color:#5b656a;line-height:1.15}
.sp{font-size:16px;color:var(--red);margin-top:4px}
.sp.done{color:#2c7a2c}
.chips{display:flex;gap:8px;justify-content:center;margin:6px 0 2px;flex-wrap:wrap;align-items:center}
.chips span{font-size:19px;margin-right:4px}
.chip{border:2px solid var(--ink);background:#fff;border-radius:20px;padding:4px 16px;font-size:19px;color:var(--ink)}
.chip.on{background:var(--yellow)}
.winart{width:min(240px,70%);margin:0 auto;display:block}
@media (prefers-reduced-motion: reduce){ .cbtn.ready{animation:none} }
</style>
</head>
<body>

<div id="app">
  <div id="wrap">
    <div id="stage">
      <canvas id="game"></canvas>
      <button id="pauseBtn" aria-label="Pause">II</button>
    </div>
    <div id="teambar" aria-label="Switch hero"></div>
    <div id="controls">
      <div class="pad">
        <button class="cbtn" data-k="l" aria-label="Move left">◀<small>Left</small></button>
        <button class="cbtn" data-k="r" aria-label="Move right">▶<small>Right</small></button>
      </div>
      <div class="pad act">
        <button class="cbtn" data-k="j" aria-label="Jump">▲<small>Jump</small></button>
        <button class="cbtn big" data-k="a" aria-label="Attack">⚔<small>Attack</small></button>
        <button class="cbtn big" data-k="s" id="spBtn" aria-label="Special move"><span class="ring"></span>★<small>Special</small></button>
      </div>
    </div>
  </div>
  <div id="hint">Arrow keys move and jump. Space attacks, K is your special. Press 1 to 9 (or tap a hero at the top) to switch heroes.</div>
</div>
<div id="overlay"></div>

<script>
(function(){
const W=960,H=540;let VW=960;const TS=()=>Math.min(1,VW/860);const PORT=()=>VW<900;const GROUND=448,GRAV=2000,LEDGE=GROUND-140,LEDGE2=GROUND-230;
const C={gray:'#727777',dgray:'#4b4f4f',black:'#262626',orange:'#f0883a',red:'#e5442c',brown:'#8b5a2b',dbrown:'#5b3a1c',
  peach:'#f6b07c',yellow:'#efd63a',ink:'#3f4b47',paper:'#fdfdfb',blue:'#1e46b8',dblue:'#14307e',teal:'#127f86',
  green:'#58c84a',dgreen:'#2c6e2c',rust:'#a9542a',gold:'#f5c518',dgold:'#c99a10',tree:'#4a9a3f',dtree:'#2d5e34'};
const FONT_BIG="'Bangers', Impact, 'Arial Black', sans-serif";
const FONT_HAND="'Patrick Hand', 'Comic Sans MS', cursive, sans-serif";
let X=null;
const lerp=(a,b,t)=>a+(b-a)*Math.max(0,Math.min(1,t));
const ease=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------- marker drawing helpers ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function el(x,y,rx,ry){X.moveTo(x+rx,y);X.ellipse(x,y,rx,ry,0,0,Math.PI*2)}
function ci(x,y,r){el(x,y,r,r)}
function poly(p){X.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)X.lineTo(p[i],p[i+1]);X.closePath()}
function blob(col,fn,a=0.94){X.save();X.globalAlpha*=a;X.fillStyle=col;X.beginPath();fn();X.fill();
  X.globalAlpha*=0.45;X.strokeStyle=col;X.lineWidth=3;X.lineJoin='round';X.stroke();X.restore()}
function stroke(col,w,fn,a=0.95){X.save();X.globalAlpha*=a;X.strokeStyle=col;X.lineWidth=w;X.lineCap='round';X.lineJoin='round';X.beginPath();fn();X.stroke();X.restore()}
function legs(col,hipY,w,ph,amp){const len=-hipY;
  for(const s of [-1,1]){const a=Math.sin(ph)*amp*s,hx=s*5;
    const fx=hx+Math.sin(a)*len,fy=Math.min(0,hipY+Math.cos(a)*len);
    stroke(col,w,()=>{X.moveTo(hx,hipY);X.lineTo(fx,fy);X.lineTo(fx+11,fy)});}}
function star(x,y,r,fill,line){X.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*.45:r;
  X.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}X.closePath();X.fillStyle=fill;X.fill();if(line){X.strokeStyle=line;X.lineWidth=2.5;X.stroke()}}
function chainArms(col,w){stroke(col,w,()=>{X.moveTo(-9,-78);X.lineTo(-32,-116);X.moveTo(9,-78);X.lineTo(32,-116)})}
function chainLine(x1,y1,x2,y2){const d=Math.hypot(x2-x1,y2-y1),n=Math.max(1,Math.round(d/15)),a=Math.atan2(y2-y1,x2-x1);
  X.save();X.strokeStyle='#8a8f8f';X.lineWidth=2.5;
  for(let i=0;i<n;i++){const t=(i+.5)/n;X.beginPath();X.ellipse(lerp(x1,x2,t),lerp(y1,y2,t),9,6,a,0,Math.PI*2);X.stroke()}X.restore()}
function bigText(txt,x,y,size,fill,rot){X.save();X.translate(x,y);X.rotate(rot||0);
  X.font=`${size}px ${FONT_BIG}`;X.textAlign='center';X.textBaseline='middle';X.lineJoin='round';
  X.lineWidth=size/7;X.strokeStyle='#2c3337';X.strokeText(txt,0,0);X.fillStyle=fill;X.fillText(txt,0,0);X.restore()}

/* ---------- projectiles art ---------- */
function drawBolt(x,y,ang,s){X.save();X.translate(x,y);X.rotate(ang);X.scale(s,s);
  blob(C.orange,()=>{X.moveTo(-6,-4);X.quadraticCurveTo(-16,-22,-30,-18);X.quadraticCurveTo(-20,-12,-18,-3);X.closePath()});
  blob(C.orange,()=>{X.moveTo(-6,4);X.quadraticCurveTo(-16,22,-30,18);X.quadraticCurveTo(-20,12,-18,3);X.closePath()});
  blob(C.orange,()=>el(-2,0,20,7));blob(C.dbrown,()=>rr(12,-6,4,12,2),.7);blob(C.gray,()=>poly([16,-7,32,0,16,7]));X.restore()}
function drawArrow(x,y,ang,s){X.save();X.translate(x,y);X.rotate(ang);X.scale(s,s);
  stroke(C.brown,3,()=>{X.moveTo(-26,0);X.lineTo(18,0)});
  blob(C.gray,()=>poly([16,-5,28,0,16,5]));
  blob(C.orange,()=>poly([-26,0,-34,-7,-20,-1]));blob(C.orange,()=>poly([-26,0,-34,7,-20,1]));X.restore()}
function drawEBolt(x,y,ang,s){X.save();X.translate(x,y);X.rotate(ang);X.scale(s,s);
  blob(C.black,()=>poly([-30,-4,14,-6,34,0,14,6,-30,4]));X.restore()}
function drawSwordIcon(x,y,s,rot){X.save();X.translate(x,y);X.rotate(rot||0);X.scale(s,s);
  blob(C.brown,()=>rr(-4,-2,8,24,3));blob(C.dgold,()=>rr(-17,-9,34,9,3));
  blob(C.gold,()=>{X.moveTo(-9,-9);X.lineTo(-9,-118);X.lineTo(0,-136);X.lineTo(9,-118);X.lineTo(9,-9);X.closePath()});
  stroke('#fff',2.5,()=>{X.moveTo(-2,-20);X.lineTo(-2,-112)},.55);X.restore()}

/* ---------- hero art (all drawn facing right, feet at 0,0) ---------- */
function drawCrossbow(f){
  const a=f.act;let rec=0,loaded=true;
  if(a&&a.fired){loaded=false;rec=Math.max(0,1-(a.t-.1)/.22)*(a.kind==='sp'?9:6)}
  legs(C.gray,-40,7,f.walk,f.amp);
  stroke(C.dgray,7,()=>{X.moveTo(-6,-78);X.lineTo(-14,-64);X.lineTo(-4,-62)});
  blob(C.gray,()=>rr(-13,-88,26,50,9));blob(C.dgray,()=>rr(-14,-60,28,8,3),.8);
  blob(C.gray,()=>el(0,-100,11,15));blob(C.red,()=>{ci(6,-116,8);ci(12,-110,6)});
  X.save();X.translate(-rec,-62);
  blob(C.gray,()=>el(-32,0,18,11));blob(C.gray,()=>el(-46,6,10,8),.85);blob(C.dgray,()=>rr(-30,-6,72,12,6));
  stroke(C.dgray,5,()=>{X.moveTo(30,-26);X.quadraticCurveTo(46,0,30,26)});
  const sx=loaded?16:27;stroke('#222',1.5,()=>{X.moveTo(30,-26);X.lineTo(sx,0);X.lineTo(30,26)});
  if(loaded)drawBolt(42,0,0,.85);X.restore();
  stroke(C.gray,7,()=>{X.moveTo(6,-80);X.lineTo(14,-66);X.lineTo(24-rec,-64)});
}
function drawSniper(f){
  const a=f.act;let rec=0;
  if(a&&a.fired){rec=Math.max(0,1-(a.t-(a.kind==='sp'?.65:.1))/.22)*(a.kind==='sp'?12:6)}
  legs(C.orange,-42,6,f.walk,f.amp);
  blob(C.orange,()=>poly([-10,-80,-34,-100,-30,-84,-12,-68]));blob(C.orange,()=>rr(-14,-84,28,44,6));
  blob(C.brown,()=>{ci(0,-102,16);ci(-4,-118,11)});blob(C.dbrown,()=>ci(3,-97,10),.8);
  X.save();X.translate(-rec,-70);
  blob(C.brown,()=>el(6,6,12,10));blob(C.gray,()=>el(34,0,22,15));blob(C.gray,()=>el(24,10,12,9));
  blob(C.dgray,()=>rr(40,-5,50,9,4));blob(C.dgray,()=>rr(26,-20,26,8,3));blob('#222',()=>ci(90,-1,3));
  if(rec>3)blob(C.yellow,()=>poly([94,-1,108,-12,104,-2,120,4,104,6,100,16]),.95);
  X.restore();
  blob(C.orange,()=>poly([6,-80,30-rec,-74,30-rec,-64,6,-66]));
}
function hammerAngle(f){const a=f.act;
  if(!a)return -0.35+Math.sin(G.t*2)*.04;
  if(a.kind==='atk'){const p=a.t/a.dur;
    if(p<.45)return lerp(-0.35,-2.3,ease(p/.45));
    if(p<.68)return lerp(-2.3,2.0,(p-.45)/.23);
    return lerp(2.0,-0.35,ease((p-.68)/.32));}
  const t=a.t;
  if(t<.38)return lerp(-0.35,-2.4,ease(t/.38));
  if(t<.48)return lerp(-2.4,2.2,(t-.38)/.1);
  if(t<.62)return 2.2;
  return lerp(2.2,-0.35,ease((t-.62)/.18));}
function drawHammer(f){
  const th=hammerAngle(f),wv=Math.sin(G.t*9+f.x*.05)*5;
  legs(C.orange,-36,5,f.walk,f.amp);
  blob(C.red,()=>{X.moveTo(-18,-82);X.quadraticCurveTo(-36,-80+wv,-52,-72+wv);X.lineTo(-46,-62+wv);X.quadraticCurveTo(-30,-70,-16,-72);X.closePath()});
  blob(C.gray,()=>el(-20,-58,10,9));blob(C.orange,()=>rr(-20,-82,40,48,6));
  stroke(C.dbrown,2,()=>{for(const y of [-72,-60,-48]){X.moveTo(17,y);X.lineTo(23,y)}},.8);
  blob(C.red,()=>rr(-22,-87,46,10,4));
  blob(C.orange,()=>{X.moveTo(-13,-86);X.arc(0,-90,13,Math.PI,0);X.lineTo(13,-86);X.closePath()});
  stroke(C.dgray,5,()=>{X.arc(0,-90,14,Math.PI*1.05,Math.PI*1.95)});
  blob(C.gray,()=>poly([-12,-98,-26,-114,-37,-111,-30,-104,-16,-92]));
  blob(C.gray,()=>poly([12,-98,24,-117,37,-115,30,-106,16,-92]));
  X.save();X.translate(16,-58);X.rotate(th);
  stroke(C.dgray,7,()=>{X.moveTo(0,14);X.lineTo(0,-62)});blob(C.black,()=>rr(-44,-92,88,38,18));
  stroke('#5a5a5a',2,()=>{X.moveTo(-14,-91);X.lineTo(-14,-55);X.moveTo(14,-91);X.lineTo(14,-55)},.7);
  X.restore();
  stroke(C.gray,9,()=>{X.moveTo(8,-74);X.lineTo(16,-58)});blob(C.gray,()=>ci(16,-58,8));
}
function drawWeight(f){
  const a=f.act;let ext=0,up=false;
  if(a&&a.kind==='atk'){const p=a.t/a.dur;ext=(p<.45?p/.45:Math.max(0,1-(p-.45)/.55))*38}
  if(a&&a.kind==='sp'){if(a.grab){up=a.gt<.5;ext=a.gt>=.5?32:0}else ext=a.t<.4?32:0}
  const s=Math.sin(f.walk)*f.amp*10;
  blob(C.gray,()=>rr(-18+s,-48,14,48,3));blob(C.gray,()=>rr(4-s,-48,14,48,3));
  if(up)blob(C.peach,()=>rr(-30,-158,13,60,6));else blob(C.peach,()=>rr(-38,-88,13,42,5));
  blob(C.gray,()=>rr(-25,-100,50,56,6));blob(C.dgray,()=>rr(-25,-52,50,9,3),.6);
  blob(C.brown,()=>poly([-27,-90,-16,-100,27,-54,16,-44]));
  blob(C.dgray,()=>el(-26,-92,11,9),.8);blob(C.dgray,()=>el(26,-92,11,9),.8);
  blob(C.gray,()=>rr(-16,-130,32,32,5));blob(C.peach,()=>rr(-10,-125,20,18,4));
  if(up)blob(C.peach,()=>rr(17,-158,13,60,6));
  else if(ext>2){blob(C.peach,()=>rr(20,-90,20+ext,14,6));blob(C.peach,()=>ci(42+ext,-83,10))}
  else blob(C.peach,()=>rr(25,-88,13,42,5));

function axeAngle(f){const a=f.act;

function startLevel(i,leaderId){
  const lv=LEVELS[i];G.level=lv;G.levelIdx=i;
  G.heroes=[];G.bads=[];G.projs=[];G.shocks=[];G.fx=[];G.pickups=[];G.banners=[];

  if(!SAVE.owned.length)SAVE.owned=[leaderId];
  let team=HEROES.filter(h=>SAVE.owned.includes(h.id)&&h.id!==lv.prisoner);if(!team.length)team=[heroById(leaderId)];
  const cand=ORIG.filter(id=>!SAVE.owned.includes(id)),cardId=cand.length?cand[Math.floor(Math.random()*cand.length)]:null;
  const order=[team.find(h=>h.id===leaderId)||team[0],...team.filter(h=>h.id!==leaderId)];
  order.forEach((d,k)=>G.heroes.push(makeHero(d,230-k*26,k)));
  G.heroes.sort((a,b)=>team.indexOf(a.def)-team.indexOf(b.def));
  G.leader=G.heroes.find(h=>h.def===order[0]);
  lv.waves.forEach((w,wi)=>{(w.ledges||[]).forEach(([k,x,y])=>makeBad(k,x,y,wi))});
  G.ledges=lv.waves.flatMap(w=>w.ledges||[]);
  if(lv.sword)G.pickups.push({kind:'sword',x:lv.sword,y:GROUND-60,t:0});
  G.obs=planObstacles(lv,team.map(h=>h.id),cardId).map(makeObstacle);G.blockX=1e9;G.toast=null;buildCardSpot(lv,cardId);
  G.chests=(lv.chests||[]).map(x=>({x,open:false,t:0}));
  G.qboxes=(lv.qboxes||[]).map(x=>({x,y:GROUND-205,used:false,bump:0}));
  for(const [x,k] of (lv.floats||[]))spawnPickup(k,x,GROUND-165);
  G.cageX=lv.len-150;
  G.prisoner=lv.final?null:{def:heroById(lv.prisoner),x:G.cageX,y:GROUND-24,vy:0,facing:-1,scale:1,walk:0,amp:0,act:null,chained:true,free:false};

  banner(`Level ${i+1}: ${lv.name}`,lv.final?'Beat the Bad King and take his castle!':`Free ${heroById(lv.prisoner).name}!`,2.6);
  SAVE.lastLeader=order[0].id;persist();

const CARD_SPOTS=['ladder','mushroom','crates','ladder','crates'];
LEVELS.forEach((lv,i)=>{const S=300,C0=2380,sh=x=>x>C0?x+S:x;
  lv.len+=S;lv.obstacles.forEach(o=>o.x=sh(o.x));lv.chests=lv.chests.map(sh);
  lv.qboxes=lv.qboxes.map(x=>x>2200&&x<=C0?2160:sh(x));lv.floats.forEach(f=>f[0]=sh(f[0]));
  if(lv.sword)lv.sword=sh(lv.sword);

function solvable(o,ids){return OBST[o.type].need.some(n=>ids.includes(n))}
function planObstacles(lv,ids,cardId){const used=new Set();
  const sig=(id,x)=>{const t=SIG[id];return t==='heavy'?{type:'heavy',style:lv.theme==='castle'?'gate':'boulder',x}:{type:t,x}};
  const pick=(o,pool,must)=>{if(solvable(o,pool)&&!used.has(o.type))return o;const c=pool.map(id=>sig(id,o.x)).filter(c=>!used.has(c.type));
    return c[Math.floor(Math.random()*c.length)]||(must?sig(pool[0],o.x):null)};
  const D=lv.obstacles,out=[];
  out[0]=pick(D[0],ids,true);used.add(out[0].type);
  out[1]=cardId?sig(cardId,D[1].x):pick(D[1],ids);if(out[1])used.add(out[1].type);
  out[2]=pick(D[2],cardId?[...ids,cardId]:ids);
  return out.filter(Boolean)}
function buildCardSpot(lv,cardId){G.plats=[];G.ladders=[];G.card=null;G.shroom=null;if(!cardId)return;

  else{G.plats.push({x0:x-66,x1:x+66,y:GROUND-62,bounce:1000,kind:'shroom'});G.shroom={x,sq:0};cx=x;cyy=GROUND-372}
  G.card={id:cardId,style:s,x:cx,y:cyy,got:false,hinted:false,t:0}}
const CARD_HINT={ladder:'Hold jump at the ladder to climb up and grab it',crates:'Jump up the crates to grab it',mushroom:'Bounce on the mushroom to grab it'};

function updateCards(dt){const c=G.card,L=G.leader;if(G.shroom)G.shroom.sq=Math.max(0,G.shroom.sq-dt);

const WALL_OFF={lock:90,gate:40};
function wallX(o){return o.x-(o.type==='lock'?90:o.style==='gate'?40:10)}
function needHero(o){return G.heroes.find(h=>o.need.includes(h.def.id))}
function needName(o){return o.type==='target'?'a shooter':heroById(o.need[0]).name}
function signX(o){return o.type==='river'?o.x-135:o.type==='target'?o.x+o.w:o.x+o.w/2}
function wrongHint(o){if(G.t-o.hintT<1.1)return;o.hintT=G.t;sfx.clink();
  const findCard=G.card&&!G.card.got&&o.need.includes(G.card.id)&&!needHero(o);
  addFx({k:'txt',x:signX(o),y:GROUND-240,txt:findCard?'Find the hero card!':`Need ${needName(o)}!`,col:C.yellow,life:1.1,rot:-.04})}
function nearObstacle(f,r){return G.obs.find(o=>!o.solved&&f.x>wallX(o)-r-(o.type==='river'?140:0)&&f.x<o.x+o.w+40)}
function solveObs(o){if(o.solved)return;o.solved=true;o.doneT=0;sfx.win();shake(.35,8);G.goT=3.5;
  const words={river:'BRIDGE BUILT!',rocks:'SMASHED!',target:'BULLSEYE!',lock:'KA-BLAM!',thorns:'SLICED!',heavy:o.style==='gate'?'GATE OPEN!':'HEAVE-HO!',barrier:'SHATTERED!'};
  addFx({k:'txt',x:signX(o),y:GROUND-250,txt:words[o.type],col:C.yellow,life:1.5,rot:-.06});
  const cols={rocks:[C.gray,C.dgray,'#9aa'],thorns:[C.dgreen,C.green,'#a14bbf'],lock:[C.gold,C.dgray],target:[C.red,'#fff'],heavy:[C.gray,C.brown],river:[C.brown,C.green],barrier:['#6f9bff','#fff',C.gold]}[o.type];
  for(let i=0;i<3;i++)sparks(o.x+o.w*(.2+i*.3),GROUND-60-i*40,10,cols)}
function hitObs(o,power,tree){
  o.shakeT=.25;
  if(o.type==='river'){if(tree.hp<=0)return;tree.hp-=power;tree.shake=.25;sfx.chop();sparks(tree.x,GROUND-60,8,[C.brown,C.tree,C.dbrown]);
    addFx({k:'txt',x:tree.x,y:GROUND-230,txt:tree.hp>0?'CHOP!':'TIMBER!',col:C.yellow,life:.7,rot:-.08});return}
  if(o.type==='target'){solveObs(o);return}
  o.prog+=power;const w={rocks:'CRACK!',thorns:'SLICE!',heavy:'HEAVE!',lock:'BLAM!',barrier:'CRASH!'}[o.type];
  if(o.type==='barrier')sfx.zap();else if(o.type==='rocks'||o.type==='heavy')sfx.boom();else if(o.type==='thorns')sfx.swing();else sfx.clink();
  sparks(o.x+o.w*.3,GROUND-80,8,o.type==='thorns'?[C.dgreen,C.green]:o.type==='lock'?[C.gold,'#fff']:[C.gray,C.dgray]);
  addFx({k:'txt',x:signX(o),y:GROUND-215,txt:w,col:C.orange,life:.7,rot:(Math.random()-.5)*.3});shake(.12,5);
  if(o.prog>=o.max)solveObs(o)}
function hitObsMelee(f,range,power,both){
  if(f.team!=='hero')return false;
  for(const o of G.obs){if(o.solved)continue;
    const lo=both||o.type==='river'?f.x-range:f.facing>0?f.x-10:f.x-range,hi=both||o.type==='river'?f.x+range:f.facing>0?f.x+range:f.x+10;
    if(o.type==='river'){for(const t of o.trees){if(t.hp<=0||t.x+26<lo||t.x-26>hi)continue;
        if(o.need.includes(f.def.id)){hitObs(o,power,t);return true}if(f===G.leader)wrongHint(o);return false}continue}
    if(o.type==='target')continue;
    if(o.x+o.w<lo||o.x-30>hi)continue;
    if(o.need.includes(f.def.id)){hitObs(o,power);return true}
    if(f===G.leader)wrongHint(o);return false}
  return false}
function obsShot(p){if(p.team!=='hero')return null;
  for(const o of G.obs){if(o.solved)continue;let x0,x1,top;
    if(o.type==='river')continue;
    if(o.type==='target'){x0=o.x+o.w-16;x1=o.x+o.w+12;top=GROUND-215}
    else if(o.type==='lock'){x0=o.x-6;x1=o.x+o.w;top=GROUND-235}
    else{x0=o.x;x1=o.x+o.w;top=GROUND-(o.style==='gate'?255:o.type==='barrier'?272:180)}
    if(p.x>x0&&p.x<x1&&p.y>top&&p.y<GROUND+4)return o}
  return null}
function shotHitsObs(p,o){
  if(o.type==='target'){hitObs(o,1);return}
  if(o.type==='lock'&&p.owner.def.id==='beard'){hitObs(o,p.kind==='pellet'?1:2);return}
  if(o.type==='barrier'&&p.owner.def.id==='liam'){hitObs(o,2);return}
  sparks(p.x,p.y,4,['#ddd',C.yellow]);if(p.owner===G.leader)wrongHint(o)}
function updateObstacles(dt){const L=G.leader;
  for(const o of G.obs){o.t+=dt;o.shakeT-=dt;if(o.solved)o.doneT+=dt;
    if(o.type==='river'&&!o.solved){for(const t of o.trees){t.shake-=dt;if(t.hp<=0&&t.fall<1){t.fall=Math.min(1,t.fall+dt*1.7);if(t.fall>=1){sfx.boom();shake(.2,6);sparks(t.x+150,GROUND-20,12,[C.tree,C.dtree,C.brown])}}}
      if(o.trees.every(t=>t.fall>=1)){o.slide=Math.min(1,(o.slide||0)+dt*1.5);if(o.slide>=1)solveObs(o)}}
    if(!o.hinted&&!o.solved&&!G.lock&&L.x>wallX(o)-(o.type==='river'?560:420)){o.hinted=true;banner(o.title,o.sub,3.4)}}
  G.blockX=1e9;for(const o of G.obs)if(!o.solved)G.blockX=Math.min(G.blockX,wallX(o));
  if(G.toast){G.toast.t+=dt;if(G.toast.t>2.4)G.toast=null}
}

/* bad guy attacks */
function startBadAttack(f){const d=f.def;

  f.act={kind:'pw',p,t:0,dur:p==='slam'?1.5:p==='spin'?1.8:p==='orbs'?1.4:1.6,armor:true,hits:new Set(),next:.45};f.pwCD=rand(4.5,6.2)}

    addProj({x:f.x,y:sy,vx:(tx-f.x)/T,vy:(GROUND-sy-.5*g*T*T)/T,grav:g,team:'bad',owner:f,dmg:d.dmg,kind:'bomb',life:4});return}
  if(f.boss||Math.random()<.5)sfx.swing();

    if(dx>-20&&dx<range&&Math.abs(h.y-f.y)<70*f.scale)hurt(f,h,d.dmg*(f.boss?1.5:1),f.facing*(f.boss?380:260),-200)}}
function doBossPower(f,a){const p=a.p||f.boss.power,sc=f.scale;
  if(p==='orbs'){f.vx=0;if(!a.fired&&a.t>=.6){a.fired=true;sfx.zap();const live=G.heroes.filter(h=>!h.ko);
      for(let i=0;i<3;i++){const tg=live[Math.floor(Math.random()*live.length)]||G.leader,tx=tg.x+rand(-60,60),sx=f.x-f.facing*32*sc,sy=f.y-190*sc,T=.9,g=900;
        addProj({x:sx,y:sy,vx:(tx-sx)/T,vy:(GROUND-40-sy-.5*g*T*T)/T,grav:g,team:'bad',owner:f,dmg:10,kind:'orb',life:3,kb:260})}}return}
  if(p==='slam'){f.vx=0;if(!a.fired&&a.t>=.85){a.fired=true;sfx.boom();shake(.5,13);sparks(f.x+f.facing*90,GROUND,16,[C.gray,C.blue,C.brown]);
      for(const d of [-1,1])G.shocks.push({x:f.x+d*70,dir:d,speed:380,life:2.6,team:'bad',owner:f,dmg:12,hitSet:new Set(),t:0,size:1.5});
      for(const h of G.heroes)if(!h.ko&&Math.abs(h.x-(f.x+f.facing*60))<130&&h.y>GROUND-60)hurt(f,h,15,Math.sign(h.x-f.x||1)*380,-320,'KA-BOOM!')}}

/* ---------- AI ---------- */
function allyThink(f,dt){
  f.think-=dt;if(f.think>0){if(f.wantAir&&!f.grounded&&f.vy>-250){f.inp.a=1;f.wantAir=false}return}
  f.think=.16+Math.random()*.12;const inp=f.inp={};const L=G.leader;
  const tgt=nearestFoe(f,620,false);
  if(!tgt){const sx=L.x-L.facing*(70+f.slot*38);if(Math.abs(sx-f.x)>34)inp[sx>f.x?'r':'l']=1;else inp.face=L.facing;return}
  const dx=tgt.x-f.x,dist=Math.abs(dx),dir=Math.sign(dx)||1,toward=dir>0?'r':'l',away=dir>0?'l':'r';
  inp.face=dir;
  if(f.def.ranged){const[lo,hi]=f.def.ai;const back=f.x-dir*120;
    if(dist<lo&&back>G.camX+40&&back<G.camX+VW-40)inp[away]=1;else if(dist>hi)inp[toward]=1;
    if(dist<hi+60&&f.atkCD<=0)inp.a=1;}
  else{const reach=f.def.reach+tgt.w*tgt.scale*.4;
    if(tgt.ledge){if(dist<40){if(f.grounded&&f.atkCD<=0){inp.j=1;f.wantAir=true}}else inp[toward]=1}
    else if(dist>reach*.85)inp[toward]=1;else if(f.atkCD<=0)inp.a=1;}
  if(f.spCD<=0){let near=0;for(const o of G.bads)if(!o.ko&&Math.abs(o.x-f.x)<(f.def.ranged?420:200))near+=o.boss?2:1;
    if(near>=2&&Math.random()<.5){inp.s=1;inp.face=dir}}
  if(inp.a||inp.s){delete inp.l;delete inp.r;f.facing=dir}
}
function badThink(f,dt){
  f.think-=dt;if(f.think>0)return;f.think=.15+Math.random()*.15;const inp=f.inp={};
  if(f.ledge&&!(G.lock&&f.wave===G.waveIdx))return;
  const t=nearestFoe(f,1400,false);if(!t)return;
  const dx=t.x-f.x,dist=Math.abs(dx),dir=Math.sign(dx)||1;inp.face=dir;

/* ---------- actor update ---------- */
function updateActor(f,dt){
  if(f.grabbedBy)return;
  f.hpShow+=(f.hp-f.hpShow)*Math.min(1,dt*6);f.flash-=dt;
  if(f.team==='hero')updatePowers(f,dt);
  if(f.ko){f.koT+=dt;physics(f,dt);if(f.grounded)f.vx*=Math.pow(.02,dt);
    if(f.team==='hero'&&f.koT>DIFF[SAVE.diff].revive&&G.phase==='play'){f.ko=false;f.hp=f.maxHp*.5;f.invT=1.5;f.y=GROUND;f.vy=0;
      addFx({k:'txt',x:f.x,y:f.y-150,txt:'Back up!',col:C.yellow,life:.9,rot:.05})}
    return}
  f.atkCD-=dt;f.spCD-=dt;f.hurtT-=dt;f.invT-=dt;if(f.pwCD!==undefined)f.pwCD-=dt;
  if(f.climb){const l=f.climb,inp=f.inp||{};f.vx=0;f.vy=0;f.act=null;
    if(f!==G.leader||inp.l||inp.r||f.hurtT>0){f.climb=null}
    else{if(inp.j){f.x=l.x;f.y-=240*dt;f.walk+=dt*10;f.amp=.4}else f.amp=0;
      if(f.y<=l.top){f.y=l.top;f.climb=null;f.x=l.x+26;f.grounded=true}return}}
  const inp=f.inp||{};let move=0;
  if(!f.act&&f.hurtT<=0){
    if(f.team==='hero'){
      move=(inp.r?1:0)-(inp.l?1:0);
      const lad=f===G.leader&&G.ladders&&G.ladders.find(l=>Math.abs(f.x-l.x)<24&&f.y>l.top+2);
      if(lad&&inp.j){f.climb=lad}
      else if(inp.j&&f.grounded){f.vy=-f.def.jump*(f.pow.boots?1.2:1);f.grounded=false;if(f===G.leader)sfx.jump()}
      if(move)f.facing=move;else if(inp.face)f.facing=inp.face;
      if(inp.s&&f.spCD<=0)startSpecial(f);else if(inp.a&&f.atkCD<=0)startAttack(f);
    }else{
      move=inp.m||0;if(inp.face)f.facing=inp.face;
      if(inp.p)startBossPower(f);else if(inp.a&&f.atkCD<=0)startBadAttack(f);
    }}

    else{if(a.kind==='atk')doBadAttack(f,a);else doBossPower(f,a)}

function physics(f,dt){
  if(f.ledge&&!f.ko)return;
  f.vy+=GRAV*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;
  let onPlat=false;
  if(f.team==='hero'&&!f.ko&&f.vy>=0&&G.plats)for(const p of G.plats){if(f.x>p.x0-6&&f.x<p.x1+6&&f.y-f.vy*dt<=p.y+1&&f.y>=p.y){
    if(p.bounce){f.y=p.y;f.vy=-p.bounce;G.shroom.sq=.25;sfx.boing();addFx({k:'txt',x:f.x,y:p.y-60,txt:'BOING!',col:C.red,life:.6,rot:.08})}
    else{f.y=p.y;f.vy=0;onPlat=true}break}}
  if(f.y>=GROUND){f.y=GROUND;f.vy=0;f.grounded=true}else f.grounded=onPlat;
  if(f.team==='hero')f.x=clamp(f.x,G.camX+24,Math.min(G.camX+VW-24,G.blockX));
  else f.x=clamp(f.x,20,G.level.len-20);
}

/* ---------- level flow ---------- */
function updateWaves(dt){
  const lv=G.level,L=G.leader;
  if(!G.lock&&G.waveIdx<lv.waves.length){const w=lv.waves[G.waveIdx];
    if(L.x>w.x-200){G.lock=w;G.goT=0;G.spawnQ=w.ground.slice(0,Math.max(2,G.heroes.length+1)).map((k,i)=>({k,t:.2+i*.7}));
      if(w.boss){G.spawnQ.push({k:w.boss.base,boss:w.boss,t:.4});banner(w.boss.name+'!','',2)}}}
  if(G.lock){const w=G.lock;
    for(const s of G.spawnQ){s.t-=dt;if(s.t<=0&&!s.done){s.done=true;const left=s.k.endsWith('<');const k=s.k.replace('<','');
        const x=left?G.camX-50:G.camX+VW+50+(s.boss?40:0);const b=makeBad(k,x,GROUND,G.waveIdx,s.boss);b.facing=left?1:-1}}
    G.spawnQ=G.spawnQ.filter(s=>!s.done);
    const boss=G.bads.find(b=>b.boss&&!b.ko);
    if(boss&&boss.boss.summon){const r=boss.hp/boss.maxHp;
      if(r<.66&&!boss.s1){boss.s1=1;G.spawnQ.push({k:'ax',t:.1},{k:'ax<',t:.6})}
      if(r<.33&&!boss.s2){boss.s2=1;G.spawnQ.push({k:'ax<',t:.1},{k:'hammer',t:.6})}}
    const left=G.bads.filter(b=>b.wave===G.waveIdx&&!b.ko);
    if(!G.spawnQ.length&&left.length&&left.every(b=>b.ledge)){G.ledgeT=(G.ledgeT||0)+dt;
      if(G.ledgeT>3){G.ledgeT=0;for(const b of left){b.ledge=false;b.vy=-260;b.grounded=false;addFx({k:'txt',x:b.x,y:b.y-120,txt:'JUMP!',col:C.yellow,life:.8,rot:0})}}}
    else G.ledgeT=0;
    if(!G.spawnQ.length&&!G.bads.some(b=>b.wave===G.waveIdx&&!b.ko)){
      G.lock=null;G.waveIdx++;
      if(w.boss&&G.level.final)startVictory();
      else if(w.boss){G.cageReady=true;banner(`Free ${G.prisoner.def.name}!`,'Run to the cage',2.4)}
      else{G.goT=4;if(G.heroes.some(h=>!h.ko&&h.hp<h.maxHp*.6))spawnPickup('heart',clamp(L.x+90,G.camX+60,G.camX+VW-60)).drop=true}}}
}
function updateCamera(dt){const lv=G.level,L=G.leader;let target;
  if(G.lock)target=G.lock.x-VW/2;else target=Math.max(G.camX,L.x-VW*.42);
  target=clamp(target,0,lv.len-VW);G.camX+=(target-G.camX)*Math.min(1,dt*4)}
function startRescue(){G.phase='rescue';G.rt=0;for(const h of G.heroes){h.inp={};if(h.ko){h.ko=false;h.hp=h.maxHp*.5;h.y=GROUND}}}
function updateRescue(dt){G.rt+=dt;const p=G.prisoner,rt=G.rt;
  if(rt>.9&&p.chained){p.chained=false;p.vy=-420;sfx.chain();
    const top=GROUND-230;for(const [x,y] of [[G.cageX-50,top+30],[G.cageX+50,top+30],[G.cageX-40,GROUND-10],[G.cageX+40,GROUND-10]])sparks(x,y,6,['#8a8f8f','#b9bdbd'])}
  if(!p.chained){p.vy+=GRAV*dt;p.y+=p.vy*dt;if(p.y>=GROUND){p.y=GROUND;p.vy=rt>1.6&&rt<3.6&&Math.random()<.04?-460:0}}
  if(rt>1.3&&!p.cheered){p.cheered=true;sfx.win();banner(`${p.def.name} is free!`,p.def.id==='liam'?'':`${p.def.name} joins the team!`,2.6)}
  if(p.def.id==='liam'&&rt>2.1&&!p.sword){p.sword=true;sfx.heal();banner('King Liam has his sword back!','',2)}
  for(const h of G.heroes)if(h.grounded&&rt>1.3&&Math.random()<dt*1.5){h.vy=-rand(380,560);h.grounded=false}
  for(const h of G.heroes){h.vx=0;physics(h,dt)}
  if(rt>(p.def.id==='liam'?5:4.2)&&!G.ended){G.ended=true;finishLevel()}}

function finishLevel(){const i=G.levelIdx;SAVE.done=Math.max(SAVE.done,i+1);const pz=LEVELS[i].prisoner;if(pz&&!SAVE.owned.includes(pz))SAVE.owned.push(pz);persist();document.body.classList.remove('playing');G.mode='over';
  if(i===LEVELS.length-1){showFinale();return}

  <canvas class="winart" data-art="hero" data-id="${d.id}" data-win="1"></canvas>

  <div class="row"><button class="go" data-act="next">Next level</button><button class="go alt" data-act="map">Map</button></div></div>`,true)}

function update(dt){
  G.dt=dt;G.phaseT+=dt;
  if(G.phase==='play'){
    G.leader.inp=leaderInput();
    for(const h of G.heroes)if(h!==G.leader&&!h.ko)allyThink(h,dt);
    for(const b of G.bads)if(!b.ko)badThink(b,dt);
    for(const h of G.heroes)updateActor(h,dt);
    for(const b of G.bads)updateActor(b,dt);
    // keep bad guys from stacking
    const gb=G.bads.filter(b=>!b.ko&&!b.ledge&&!b.grabbedBy);
    for(let i=0;i<gb.length;i++)for(let j=i+1;j<gb.length;j++){const a=gb[i],b=gb[j],d=b.x-a.x,m=(a.w*a.scale+b.w*b.scale)*.4;
      if(Math.abs(d)<m){const push=(m-Math.abs(d))*.5*Math.sign(d||1);if(!a.boss)a.x-=push*Math.min(1,dt*8);if(!b.boss)b.x+=push*Math.min(1,dt*8)}}
    updateWaves(dt);
    if(G.cageReady&&Math.abs(G.leader.x-G.cageX)<130)startRescue();
  }else if(G.phase==='rescue'){updateRescue(dt);for(const b of G.bads)updateActor(b,dt)}
  else if(G.phase==='victory'){updateVictory(dt);for(const b of G.bads)updateActor(b,dt)}
  else if(G.phase==='fail'){for(const h of G.heroes)updateActor(h,dt);for(const b of G.bads){b.inp={};updateActor(b,dt)}
    if(G.phaseT>2&&!G.failShown){G.failShown=true;showFail()}}
  G.bads=G.bads.filter(b=>!(b.ko&&b.koT>1.5));
  // projectiles
  for(const p of G.projs){p.life-=dt;if(p.grav)p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.kind==='bomb'){if(!p.landed&&p.y>=GROUND){p.landed=true;p.y=GROUND;p.vx=0;p.vy=0;p.grav=0;p.fuse=.75}
      if(p.landed){p.fuse-=dt;if(p.fuse<=0){p.dead=true;sfx.boom();shake(.25,8);sparks(p.x,GROUND-10,16,[C.orange,C.yellow,C.black]);
          for(const h of G.heroes)if(!h.ko&&Math.abs(h.x-p.x)<85&&h.y>GROUND-110)hurt(p.owner,h,p.dmg,Math.sign(h.x-p.x||1)*300,-360,'KABOOM!')}}
      continue}
    const ob=obsShot(p);if(ob){shotHitsObs(p,ob);p.dead=true;continue}
    const targets=p.team==='hero'?G.bads:G.heroes;
    for(const o of targets){if(o.ko||o.grabbedBy||(p.hitSet&&p.hitSet.has(o)))continue;const hw=o.w*o.scale*.5+6;
      if(Math.abs(p.x-o.x)<hw&&p.y>o.y-o.h*o.scale&&p.y<o.y+6){hurt(p.owner,o,p.dmg,Math.sign(p.vx)*p.kb,-140,p.word);
        if(p.pierce)p.hitSet.add(o);else{p.dead=true;break}}}
    if(p.y>GROUND+2&&!p.dead){p.dead=true;sparks(p.x,GROUND,3,['#c9c2b2'])}
    if(p.life<=0||p.x<G.camX-120||p.x>G.camX+VW+120)p.dead=true;}
  G.projs=G.projs.filter(p=>!p.dead);
  for(const s of G.shocks){s.t+=dt;s.x+=s.dir*s.speed*dt;s.life-=dt;
    const targets=s.team==='hero'?G.bads:G.heroes;
    for(const o of targets){if(o.ko||o.grabbedBy||o.ledge||s.hitSet.has(o))continue;
      if(Math.abs(s.x-o.x)<30*s.size+o.w*o.scale*.3&&o.y>GROUND-40){s.hitSet.add(o);hurt(s.owner,o,s.dmg,s.dir*220,-420,'BOOM!')}}
    if(Math.random()<dt*20)sparks(s.x,GROUND,1,['#b9b2a2'])}
  G.shocks=G.shocks.filter(s=>s.life>0&&s.x>G.camX-60&&s.x<G.camX+VW+60);
  if(G.wipeT>0&&G.phase==='play'){G.wipeT-=dt;if(G.wipeT<=0){for(const h of G.heroes)reviveHero(h);sfx.heal();

  drawWorld();
  X.save();X.translate(-G.camX,0);
  for(const k of G.pickups)drawPickup(k);
  for(const s of G.shocks){X.save();X.translate(s.x,GROUND);X.scale(s.dir*s.size,s.size);const q=1+Math.sin(s.t*30)*.12;X.scale(q,q);
    const col=s.team==='bad'?C.blue:C.gray;blob(col,()=>poly([-26,0,-14,-30,-6,-12,4,-44,14,-14,26,-26,30,0]));X.restore()}
  for(const p of G.projs)if(p.kind==='bomb'&&p.landed){X.save();X.setLineDash([8,6]);X.globalAlpha=.5+.4*Math.sin(G.t*30);
    X.strokeStyle=C.red;X.lineWidth=3;X.beginPath();X.ellipse(p.x,GROUND+4,85,16,0,0,Math.PI*2);X.stroke();X.restore()}
  for(const f of G.heroes)if(f.def.id==='sniper'&&f.act&&f.act.kind==='sp'&&!f.act.fired){const y=f.y-71,x0=f.x+f.facing*92;
    X.save();X.setLineDash([10,8]);X.lineDashOffset=-G.t*80;X.globalAlpha=.5+.4*Math.sin(G.t*30);stroke(C.red,2.5,()=>{X.moveTo(x0,y);X.lineTo(x0+f.facing*900,y)});X.restore()}
  const all=[...G.bads,...G.heroes];for(const f of all)drawShadow(f);
  for(const f of G.bads)if(f.ledge||f.ko)drawActor(f);
  for(const f of G.bads)if(!f.ledge&&!f.ko&&!f.grabbedBy)drawActor(f);
  for(const f of G.heroes)if(f!==G.leader)drawActor(f);
  drawActor(G.leader);
  for(const f of G.heroes)drawHeroPowers(f);
  for(const v of G.town||[])drawVillager(v);
  for(const f of G.bads)if(f.grabbedBy)drawActor(f);
  for(const f of G.bads)if(!f.ko&&!f.boss&&f.hp<f.maxHp){const bw=40,x=f.x-bw/2,y=f.y-f.h*f.scale-14;
    X.fillStyle='rgba(255,255,255,.9)';X.fillRect(x,y,bw,5);X.fillStyle=C.red;X.fillRect(x,y,bw*Math.max(0,f.hpShow/f.maxHp),5);X.strokeStyle='#2c3337';X.lineWidth=1;X.strokeRect(x,y,bw,5)}
  for(const f of G.heroes)if(f.def.id==='axman'&&f.act&&f.act.kind==='sp'){const a0=G.t*18;stroke('rgba(110,115,115,.6)',4,()=>{X.arc(f.x,f.y-60,72,a0,a0+2.2)})}
  for(const f of G.bads)if(f.boss&&f.boss.power==='spin'&&f.act&&f.act.kind==='pw'&&f.act.t>.45){const a0=G.t*16;stroke('rgba(30,70,184,.45)',6,()=>{X.arc(f.x,f.y-60*f.scale,64*f.scale,a0,a0+2.4)})}
  for(const f of G.heroes)if(f.ko&&f.grounded)for(let i=0;i<3;i++){const a=G.t*4+i*2.1;star(f.x-f.facing*95+Math.cos(a)*22,f.y-22+Math.sin(a)*7,7,C.yellow,'#2c3337')}
  if(G.phase==='play'){const L=G.leader,b=Math.sin(G.t*6)*4;X.save();X.translate(L.x,L.y-L.h-34+b);blob(C.yellow,()=>poly([-12,-10,12,-10,0,8]));
    X.lineWidth=2;X.strokeStyle='#2c3337';X.beginPath();poly([-12,-10,12,-10,0,8]);X.stroke();X.restore()}
  for(const p of G.projs){const ang=Math.atan2(p.vy,p.vx);
    if(p.team==='hero'&&p.owner.pow&&p.owner.pow.fire){X.save();X.globalAlpha=.55;X.fillStyle=C.orange;X.beginPath();X.arc(p.x,p.y,12,0,7);X.fill();X.restore()}
    if(p.kind==='bolt')drawBolt(p.x,p.y,ang,.8);
    else if(p.kind==='arrow')drawArrow(p.x,p.y,ang,.9);
    else if(p.kind==='ebolt')drawEBolt(p.x,p.y,ang,.9);
    else if(p.kind==='gold'){const d=Math.sign(p.vx);stroke(C.gold,9,()=>{X.arc(p.x-d*20,p.y,46,d>0?-1.1:Math.PI-1.1+2.2-2.2,d>0?1.1:Math.PI+1.1)},.9);stroke('#fff',3,()=>{X.arc(p.x-d*20,p.y,46,d>0?-.7:Math.PI-.7,d>0?.7:Math.PI+.7)},.8)}
    else if(p.kind==='orb'){X.save();X.globalAlpha=.4;X.fillStyle='#6f9bff';X.beginPath();X.arc(p.x,p.y,18,0,7);X.fill();X.restore();blob('#3b6fd1',()=>ci(p.x,p.y,10));blob('#c9d8ff',()=>ci(p.x-3,p.y-3,4))}
    else if(p.kind==='bomb'){blob(C.black,()=>ci(p.x,p.y-10,12));if(Math.floor(G.t*14)%2)blob(C.yellow,()=>ci(p.x+8,p.y-24,4))}
    else if(p.kind==='pellet'){stroke('rgba(75,79,79,.5)',3,()=>{X.moveTo(p.x-p.vx*.03,p.y-p.vy*.03);X.lineTo(p.x,p.y)});blob(C.black,()=>ci(p.x,p.y,4))}
    else{const big=p.kind==='power',d=Math.sign(p.vx);stroke(big?C.orange:'rgba(75,79,79,.45)',big?6:3,()=>{X.moveTo(p.x-d*(big?90:40),p.y-p.vy/Math.abs(p.vx||1)*(big?90:40)*d);X.lineTo(p.x,p.y)},.7);
      blob(big?C.red:C.dgray,()=>el(p.x,p.y,big?11:7,big?6:4))}}
  for(const e of G.fx){
    if(e.k==='p'){X.globalAlpha=1-e.t/e.life;X.fillStyle=e.col;X.beginPath();X.arc(e.x,e.y,e.r,0,7);X.fill();X.globalAlpha=1}
    else if(e.k==='txt'){const s=e.t<.1?e.t/.1*1.3:1.3-.3*Math.min(1,(e.t-.1)/.12);
      X.save();X.globalAlpha=Math.min(1,(e.life-e.t)/.2);X.translate(e.x,e.y-e.t*30);X.scale(s,s);bigText(e.txt,0,0,34,e.col,e.rot);X.restore()}}
  X.restore();
  X.setTransform(SC,0,0,SC,0,0);drawHUD();
}

cv.addEventListener('pointerdown',e=>{if(G.mode!=='level'||G.phase!=='play'||G.paused)return;ensureAudio();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*VW,y=(e.clientY-r.top)/r.height*H;
  for(const p of G.portraits)if(x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h){trySetLeader(p.hero);e.preventDefault();break}});

/* ---------- layout ---------- */
const stage=document.getElementById('stage'),wrap=document.getElementById('wrap'),app=document.getElementById('app');
function layout(){
  const isTouch=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
  document.body.classList.toggle('touch',isTouch);
  const cs=getComputedStyle(app);const aw=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=app.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const portrait=ah>aw*1.05;document.body.classList.toggle('portrait',portrait);
  VW=portrait?600:960;const ar=VW/H;
  const reserve=portrait?(isTouch?330:110):(isTouch?0:44);
  let w=Math.min(aw,(ah-reserve-8)*ar);w=Math.max(240,w);const h=w/ar;
  stage.style.width=w+'px';stage.style.height=h+'px';wrap.style.width=(portrait?Math.max(w,Math.min(aw,560)):w)+'px';
  const dpr=Math.min(2.5,window.devicePixelRatio||1);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);SC=cv.width/VW;
  if(G.level&&G.mode==='level')G.camX=clamp(G.camX,0,G.level.len-VW);}
addEventListener('resize',()=>{layout();sizeArt()});
addEventListener('orientationchange',()=>setTimeout(()=>{layout();sizeArt()},250));

/* ---------- menus ---------- */
const ov=document.getElementById('overlay');
function showOverlay(html,dim){ov.innerHTML=html;ov.classList.remove('hidden');ov.classList.toggle('dim',!!dim);ov.scrollTop=0;sizeArt()}
function hideOverlay(){ov.classList.add('hidden');ov.innerHTML=''}
function sizeArt(){const dpr=Math.min(2.5,window.devicePixelRatio||1);
  ov.querySelectorAll('canvas').forEach(c=>{const r=c.getBoundingClientRect();if(!r.width)return;
    const ratio=(c.dataset.art==='title'||c.dataset.art==='finale')?9/16:1.05;c.style.height=(r.width*ratio)+'px';
    c.width=Math.round(r.width*dpr);c.height=Math.round(r.width*ratio*dpr)})}
const soundBtn=()=>`<button class="link" data-act="sound">${muted?'Sound is off, tap to turn on':'Sound is on, tap to turn off'}</button>`;
let resetArmed=false;
function showTitle(){G.mode='menu';document.body.classList.remove('playing');resetArmed=false;
  showOverlay(`<div class="sheet"><h1>Save King Liam</h1>
  <p class="lede">The bad guys stormed in and carried off King Liam and his best warriors. Lead the heroes into battle, free them all, then take down the Bad King!</p>
  <canvas class="art" data-art="title"></canvas>
  <button class="go" data-act="map">${SAVE.done>0&&SAVE.done<LEVELS.length?'Keep going':'Start the rescue'}</button>
  ${SAVE.done>0?'<button class="link" data-act="reset">Start over from level 1</button>':''}${soundBtn()}</div>`)}
function showMap(){G.mode='menu';document.body.classList.remove('playing');
  const cards=LEVELS.map((l,i)=>{const locked=i>SAVE.done,freed=i<SAVE.done;
    if(l.final)return `<button class="card" data-level="${i}" ${locked?'disabled':''}><canvas data-art="boss" data-free="${freed?1:''}"></canvas>
    <div class="nm">Level ${i+1}</div><div class="desc">${l.name}</div>
    <div class="sp ${freed?'done':''}">${freed?'The castle is yours':locked?`Beat level ${i} first`:'Beat the Bad King'}</div></button>`;
    const d=heroById(l.prisoner);
    return `<button class="card" data-level="${i}" ${locked?'disabled':''}><canvas data-art="pris" data-id="${d.id}" data-free="${freed?1:''}"></canvas>
    <div class="nm">Level ${i+1}</div><div class="desc">${l.name}</div>
    <div class="sp ${freed?'done':''}">${freed?`${d.name} is free`:locked?`Beat level ${i} first`:`Free ${d.name}`}</div></button>`}).join('');
  showOverlay(`<div class="sheet"><h2>Rescue mission</h2>
  <p class="lede">${SAVE.done>=LEVELS.length?'You beat the Bad King and the castle is yours! Play any level again.':'Win a level to free the prisoner in the cage. They join your team!'}</p>
  <div class="cards lv">${cards}</div><button class="link" data-act="title">Back</button></div>`)}
let pickLevel=0;
function showPick(i){pickLevel=i;const first=!SAVE.owned.length;const team=first?HEROES.filter(h=>ORIG.includes(h.id)):HEROES.filter(h=>SAVE.owned.includes(h.id)&&h.id!==LEVELS[i].prisoner);
  showOverlay(`<div class="sheet"><h2>${first?'Pick your first hero':'Who leads the team?'}</h2>
  <p class="lede">${first?'You start on your own. Find hero cards along the way to build your team!':'You control the leader. Everyone else fights alongside, and you can switch heroes any time.'}</p>
  <div class="chips"><span>How tough:</span>${['easy','normal'].map(d=>`<button class="chip ${SAVE.diff===d?'on':''}" data-diff="${d}">${d==='easy'?'Easy':'Normal'}</button>`).join('')}</div>
  <div class="cards">${team.map(d=>`<button class="card" data-pick="${d.id}"><canvas data-art="hero" data-id="${d.id}"></canvas>
    <div class="nm">${d.name}</div><div class="desc">${d.blurb}</div><div class="sp">★ ${d.special.name}</div></button>`).join('')}</div>
  <button class="link" data-act="map">Back to the map</button></div>`)}
function showFinale(){sfx.win();
  showOverlay(`<div class="sheet"><h1>The castle is yours!</h1>
  <canvas class="art" data-art="finale"></canvas>
  <p class="lede">The heroes freed Blak Beard, Will, Fill and King Liam, then beat the Bad King and took over his castle. The whole town cheered, because he was the worst king ever!</p>
  <div class="row"><button class="go" data-act="map">Play a level again</button><button class="go alt" data-act="title">Title</button></div></div>`,true)}
function togglePause(){
  if(G.paused){G.paused=false;hideOverlay();return}
  if(G.mode!=='level')return;G.paused=true;for(const k in touch)touch[k]=false;
  showOverlay(`<div class="sheet small"><h2>Paused</h2>
  <div class="row"><button class="go" data-act="resume">Keep playing</button><button class="go alt" data-act="quit">Leave level</button></div>${soundBtn()}</div>`,true)}
document.getElementById('pauseBtn').addEventListener('click',togglePause);

ov.addEventListener('click',e=>{ensureAudio();
  const lvB=e.target.closest('[data-level]'),pk=e.target.closest('[data-pick]'),df=e.target.closest('[data-diff]'),ac=e.target.closest('[data-act]');
  if(df){SAVE.diff=df.dataset.diff;persist();sfx.pick();ov.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===df));return}
  if(lvB&&!lvB.disabled){sfx.pick();showPick(+lvB.dataset.level);return}
  if(pk){sfx.pick();startLevel(pickLevel,pk.dataset.pick);return}
  if(!ac)return;const a=ac.dataset.act;sfx.pick();
  if(a==='map')showMap();
  else if(a==='title')showTitle();
  else if(a==='next'){const n=Math.min(G.levelIdx+1,LEVELS.length-1);showPick(n)}
  else if(a==='retry'){G.failShown=false;G.ended=false;startLevel(G.levelIdx,G.leader.def.id)}
  else if(a==='resume')togglePause();
  else if(a==='quit'){G.paused=false;showMap()}
  else if(a==='reset'){if(!resetArmed){resetArmed=true;ac.textContent='Tap again to erase progress and start over';return}
    SAVE.done=0;SAVE.owned=[];persist();showTitle()}
  else if(a==='sound'){muted=!muted;ac.textContent=muted?'Sound is off, tap to turn on':'Sound is on, tap to turn off'}
});
const _start=startLevel;startLevel=function(i,id){G.failShown=false;G.ended=false;_start(i,id)};

/* menu canvases */
function demo(def,x,y,fc,phase,attack){const f={def,x,y,facing:fc,walk:0,amp:0,act:null,hurtT:0,ko:false,scale:1,h:120,armed:true};
  if(attack&&def.attack){const cyc=(G.t+phase)%2.4,A=def.attack;if(cyc<A.dur)f.act={kind:'atk',t:cyc,dur:A.dur,fired:cyc>=(A.fireAt||0)}}
  return f}
function miniGround(lw,gy){stroke(C.ink,2.5,()=>{X.moveTo(8,gy);X.lineTo(lw-8,gy)})}
function drawMenus(){
  if(ov.classList.contains('hidden'))return;
  ov.querySelectorAll('canvas').forEach(c=>{if(!c.width)return;X=c.getContext('2d');X.setTransform(1,0,0,1,0,0);
    X.fillStyle=C.paper;X.fillRect(0,0,c.width,c.height);const art=c.dataset.art;
    if(art==='title'||art==='finale'){const s=c.width/W;X.setTransform(s,0,0,s,0,0);
      X.fillStyle='rgba(139,90,43,.12)';X.fillRect(0,GROUND,W,H-GROUND);stroke(C.ink,3,()=>{X.moveTo(0,GROUND+2);X.lineTo(W,GROUND+2)});
      for(let i=0;i<22;i++){const x=20+i*44+hash(i)*16,y=GROUND+20+hash(i+9)*55;stroke(C.yellow,2.5,()=>{X.moveTo(x,y);X.lineTo(x-4,y-12);X.moveTo(x,y);X.lineTo(x+7,y-10)},.75)}
      if(art==='title'){
        drawCastle(560,GROUND,.75,true);
        HEROES.slice(0,5).forEach((d,i)=>drawActor(demo(d,70+i*88,GROUND,1,i*.47,true)));
        [['ax',560],['hammer',650],['muscle',600]].forEach(([k,x],i)=>{const f=demo(BADS[k],x,GROUND,-1,i);f.w=40;drawActor(f)});
        const cx=860,top=GROUND-230,py=GROUND-24;X.save();X.globalAlpha=.07;X.fillStyle='#000';X.fillRect(cx-75,top,150,230);X.restore();
        chainLine(cx-70,top+12,cx-32,py-116);chainLine(cx+70,top+12,cx+32,py-116);chainLine(cx-70,GROUND-6,cx-12,py);chainLine(cx+70,GROUND-6,cx+12,py);
        drawActor({def:LIAM,x:cx,y:py,facing:-1,walk:0,amp:0,act:null,chained:true,scale:1});
        stroke(C.dgray,5,()=>{for(let x=cx-70;x<=cx+70;x+=20){X.moveTo(x,top);X.lineTo(x,GROUND)}});blob(C.dgray,()=>rr(cx-80,top-10,160,14,4));
      }else{
        drawCastle(560,GROUND,.75,true,true);
        for(let i=0;i<7;i++){const vx=40+i*130+(i>3?40:0);drawVillager({x:vx,y:GROUND-Math.abs(Math.sin(G.t*4+i*1.3))*22,facing:i%2?-1:1,kid:i%3===2,hat:i%3,flower:i===1,col:['#4a9a3f','#8e5bbf','#127f86','#d9893f','#c0392b','#3b6fd1'][i%6],walk:0,moving:false,cheer:true})}
        const team=HEROES.filter(h=>h.id!=='liam');team.forEach((d,i)=>{const side=i<4?-1:1,k=i%4;const x=480+side*(120+k*86);
          const f=demo(d,x,GROUND-Math.abs(Math.sin(G.t*4+i))*30,side<0?1:-1,i,false);drawActor(f)});
        const L={def:LIAM,x:480,y:GROUND,facing:1,walk:0,amp:0,act:null,sword:true,scale:1.3};drawActor(L);
        for(let i=0;i<60;i++){const x=(i*137+G.t*20*(i%3+1))%W,y=(i*53+G.t*(60+i%5*20))%GROUND;X.fillStyle=[C.yellow,C.orange,C.red,C.blue,C.green][i%5];X.fillRect(x,y,7,11)}
      }
      return}
    const s=c.height/200;X.setTransform(s,0,0,s,0,0);const lw=c.width/s,gy=184;
    if(art==='boss'){miniGround(lw,gy);const cx=lw/2;
      if(c.dataset.free){drawActor({def:LIAM,x:cx,y:gy-Math.abs(Math.sin(G.t*4))*16,facing:1,walk:0,amp:0,act:null,scale:1,sword:true});star(cx+52,40,14,C.yellow,'#2c3337')}
      else drawActor({def:BADS.king,x:cx+8,y:gy,facing:-1,walk:0,amp:0,act:null,scale:.8,h:205});return}
    if(art==='pris'){const d=heroById(c.dataset.id),free=!!c.dataset.free,cx=lw/2;miniGround(lw,gy);
      if(free){drawActor({def:d,x:cx,y:gy-Math.abs(Math.sin(G.t*4))*16,facing:1,walk:0,amp:0,act:null,scale:1,sword:d.id==='liam'});
        star(cx+52,40,14,C.yellow,'#2c3337');return}
      const top=gy-170,py=gy-10;chainLine(cx-58,top+10,cx-32,py-116);chainLine(cx+58,top+10,cx+32,py-116);chainLine(cx-58,gy-4,cx-12,py);chainLine(cx+58,gy-4,cx+12,py);
      drawActor({def:d,x:cx,y:py,facing:1,walk:0,amp:0,act:null,chained:true,scale:1});
      stroke(C.dgray,4,()=>{for(let x=cx-60;x<=cx+60;x+=20){X.moveTo(x,top);X.lineTo(x,gy)}});blob(C.dgray,()=>rr(cx-66,top-8,132,12,4));return}
    if(art==='hero'){const d=heroById(c.dataset.id);miniGround(lw,gy);
      const f=demo(d,lw/2-14,gy,1,d.id.length*.37,!c.dataset.win);if(c.dataset.win)f.y=gy-Math.abs(Math.sin(G.t*4))*24;drawActor(f)}
  })}

/* ---------- loop ---------- */
let last=performance.now();
const tb=document.getElementById('teambar');let tbKey='';
function updateTeamBar(){if(G.mode!=='level'||!PORT()){if(tbKey){tb.innerHTML='';tbKey=''}return}
  const key=G.heroes.map(h=>h.def.id).join(',');
  if(key!==tbKey){tbKey=key;tb.innerHTML=G.heroes.map((h,i)=>`<button class="tbtn" data-i="${i}" aria-label="Play as ${h.def.name}"><canvas width="96" height="96"></canvas><i></i></button>`).join('')}
  const dpr=1;[...tb.children].forEach((b,i)=>{const h=G.heroes[i];if(!h)return;const c=b.firstChild,x=c.getContext('2d');
    b.classList.toggle('lead',h===G.leader);b.classList.toggle('ko',h.ko);b.classList.toggle('need',(G.needIds||[]).includes(h.def.id)&&!h.ko);
    b.lastChild.style.width=Math.max(0,h.hpShow/h.maxHp*100)+'%';b.lastChild.style.background=h.hp/h.maxHp>.5?'#5bbf4a':h.hp/h.maxHp>.25?C.yellow:C.red;
    const prev=X;X=x;X.setTransform(1,0,0,1,0,0);X.clearRect(0,0,96,96);X.translate(48,112);X.scale(.7,.7);
    h.def.draw({def:h.def,act:null,walk:0,amp:0,x:0,facing:1,armed:true});X=prev})}
tb.addEventListener('pointerdown',e=>{const b=e.target.closest('.tbtn');if(!b||G.phase!=='play'||G.paused)return;e.preventDefault();ensureAudio();const h=G.heroes[+b.dataset.i];if(h)trySetLeader(h)});
function frame(now){let dt=Math.min(.033,(now-last)/1000);last=now;
  if(G.slow>0){G.slow-=dt;dt*=.35}
  G.t+=dt;
  if(G.mode==='level'&&!G.paused)update(dt);
  render();drawMenus();updateTeamBar();
  if(G.leader&&G.mode==='level'){const sb=document.getElementById('spBtn'),f=G.leader,r=clamp(1-f.spCD/f.def.special.cd,0,1);
    sb.style.setProperty('--p',(r*100)+'%');sb.classList.toggle('ready',r>=1&&G.phase==='play')}
  requestAnimationFrame(frame)}
layout();showTitle();
window.__G=G;window.__start=(i,id)=>startLevel(i,id);
requestAnimationFrame(frame);
})();
</script>
