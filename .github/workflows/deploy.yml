name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_FxOsNFL6LfiUWAKyE1KR4AVJ
      VERCEL_PROJECT_ID: prj_CFtRTLLWQCyN1c32AEPvw6x9w4iY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to production
        run: npx --yes vercel@latest deploy --prod --yes --token "${{ secrets.VERCEL_TOKEN }}"
      - name: Check the high score service
        run: |
          sleep 5
          code=$(curl -s -o body.txt -w '%{http_code}' https://save-king-liam.vercel.app/api/players)
          echo "::notice title=High scores::HTTP $code $(head -c 200 body.txt)"
